    <h1>広告の開示</h1>
    <p>当サイトの記事には、アフィリエイト（紹介経由で契約や購入があった場合に運営者が報酬を受け取る広告）が含まれます。</p>
    <p>報酬の有無が、実測結果の改ざんにつながらないようにします。向いていない人には向いていないと書きます。</p>
    <p>景品表示法上のステルスマーケティング（広告なのに広告と分からない表示）を避けるため、各ページ上部にも同じ趣旨を表示します。</p>
    <p>出典: 消費者庁<br>
    <a href="https://www.caa.go.jp/policies/policy/representation/fair_labeling/stealth_marketing">ステルスマーケティング規制</a></p>
